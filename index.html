<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday ✦</title>
  <meta name="description" content="A birthday surprise made with love">
  <link rel="icon" href="assets/images/placeholder.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Lora:ital,wght@0,400;0,600;1,400&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/sections.css">
</head>
<body>

  <!-- Music Control -->
  <div id="music-control" class="music-control">
    <button id="music-btn" class="music-btn" aria-label="Play music" aria-pressed="false" title="Play or pause music">
      <span class="music-icon" aria-hidden="true">&#9835;</span>
    </button>
  </div>

  <nav class="journey-progress" aria-label="Birthday journey">
    <span class="journey-label">A little journey</span>
    <ol>
      <li class="journey-step active" data-step="opening-screen"><span>01</span><b>Begin</b></li>
      <li class="journey-step" data-step="birthday-reveal"><span>02</span><b>Reveal</b></li>
      <li class="journey-step" data-step="cake-section"><span>03</span><b>Wish</b></li>
      <li class="journey-step" data-step="memories-section"><span>04</span><b>Remember</b></li>
      <li class="journey-step" data-step="surprise-section"><span>05</span><b>Open</b></li>
      <li class="journey-step" data-step="final-screen"><span>06</span><b>Always</b></li>
    </ol>
  </nav>

  <!-- Section 1: Opening Screen -->
  <section id="opening-screen" class="screen active">
    <canvas id="particles-canvas"></canvas>
    <div class="opening-content">
      <div class="opening-seal" aria-hidden="true">&#10022;</div>
      <p class="opening-kicker">A little something, made just for you</p>
      <p class="opening-text" id="opening-text"></p>
      <button class="cta-btn" id="open-surprise-btn"></button>
      <p class="opening-note">Take your time. There is no rush.</p>
    </div>
  </section>

  <!-- Section 2: Birthday Reveal -->
  <section id="birthday-reveal" class="screen">
    <canvas id="reveal-particles"></canvas>
    <div class="reveal-content">
      <div class="reveal-cake" aria-label="A birthday cake" role="img">
        <div class="reveal-cake-candle reveal-cake-candle-one"><i></i></div>
        <div class="reveal-cake-candle reveal-cake-candle-two"><i></i></div>
        <div class="reveal-cake-candle reveal-cake-candle-three"><i></i></div>
        <div class="reveal-cake-topper"></div>
        <div class="reveal-cake-icing"></div>
        <div class="reveal-cake-body"></div>
        <div class="reveal-cake-plate"></div>
      </div>
      <p class="reveal-pre" id="reveal-pre"></p>
      <h1 class="reveal-name" id="reveal-name"></h1>
      <p class="reveal-sub" id="reveal-sub"></p>
    </div>
  </section>

  <!-- Section 3: Interactive Cake -->
  <section id="cake-section" class="screen">
    <div class="cake-wrapper">
      <p class="cake-text" id="cake-text"></p>
      <p class="cake-permission" id="cake-permission" aria-live="polite"></p>
      <div class="cake-container">
        <div class="cake">
          <div class="candles-row" id="candles-row">
            <!-- Candles generated by JS -->
          </div>
          <div class="cake-layer cake-frosting"></div>
          <div class="cake-layer cake-top"></div>
          <div class="cake-layer cake-middle"></div>
          <div class="cake-layer cake-bottom"></div>
          <div class="cake-plate"></div>
        </div>
      </div>
      <p class="cake-message" id="cake-message"></p>
    </div>
    <canvas id="confetti-canvas"></canvas>
  </section>

  <!-- Section 4: Memories / Our Story -->
  <section id="memories-section" class="section">
    <div class="container">
      <h2 class="section-title" id="memories-title"></h2>
      <div class="timeline" id="timeline-container">
        <!-- Memory cards generated by JS -->
      </div>
    </div>
  </section>

  <!-- Section 5: Photo Gallery -->
  <section id="gallery-section" class="section">
    <div class="container">
      <h2 class="section-title" id="gallery-title"></h2>
      <div class="gallery-grid" id="gallery-container">
        <!-- Gallery items generated by JS -->
      </div>
    </div>
    <!-- Lightbox -->
    <div id="lightbox" class="lightbox">
      <div class="lightbox-overlay"></div>
      <div class="lightbox-inner">
        <button class="lightbox-close" id="lightbox-close" aria-label="Close">&times;</button>
        <button class="lightbox-nav lightbox-prev" id="lightbox-prev" aria-label="Previous">&#8249;</button>
        <button class="lightbox-nav lightbox-next" id="lightbox-next" aria-label="Next">&#8250;</button>
        <div class="lightbox-content">
          <img id="lightbox-img" src="" alt="">
          <p class="lightbox-caption" id="lightbox-caption"></p>
        </div>
      </div>
    </div>
  </section>

  <!-- Section 6: Things I Love About You -->
  <section id="reasons-section" class="section">
    <div class="container">
      <h2 class="section-title" id="reasons-title"></h2>
      <div class="reasons-container" id="reasons-container">
        <!-- Reason items generated by JS -->
      </div>
    </div>
  </section>

  <!-- Section 7: Interactive Surprise -->
  <section id="surprise-section" class="screen">
    <div class="surprise-content">
      <p class="surprise-text" id="surprise-text"></p>
      <div class="envelope-wrapper" id="envelope-wrapper">
        <div class="envelope" id="envelope">
          <div class="envelope-flap"></div>
          <div class="envelope-body"></div>
          <div class="envelope-heart">&#9829;</div>
        </div>
      </div>
      <button class="cta-btn surprise-btn" id="open-envelope-btn"></button>
    </div>
  </section>

  <!-- Section 8: Final Letter -->
  <section id="letter-section" class="screen">
    <div class="letter-container">
      <h2 class="letter-title" id="letter-title"></h2>
      <div class="letter-content" id="letter-content"></div>
      <button class="cta-btn letter-continue" id="letter-continue-btn" type="button">
        Continue to the final moment &#10022;
      </button>
    </div>
  </section>

  <!-- Section 9: Final Screen -->
  <section id="final-screen" class="screen">
    <canvas id="final-particles"></canvas>
    <div class="final-content">
      <p class="final-pre">Happy Birthday,</p>
      <h1 class="final-name" id="final-name"></h1>
      <p class="final-quote" id="final-quote"></p>
      <p class="final-credit" id="final-credit"></p>
    </div>
  </section>

  <!-- Scripts (order matters) -->
  <script src="js/data.js?v=10"></script>
  <script src="js/particles.js"></script>
  <script src="js/audio.js?v=3"></script>
  <script src="js/sections.js?v=2"></script>
  <script src="js/main.js?v=2"></script>
</body>
</html>
